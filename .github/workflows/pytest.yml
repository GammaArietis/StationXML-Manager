# Pytest su push verso main (obspy/ObsPy + resto da requirements.txt; pytest da requirements-dev.txt).
name: pytest

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      # Evita richieste display se moduli Qt vengono caricati in headless CI
      QT_QPA_PLATFORM: offscreen
      # Evita che configurazioni Git di sistema del runner interferiscano con checkout/submodules/LFS.
      GIT_CONFIG_NOSYSTEM: "1"
      # Opt-in al runtime Node.js 24 per evitare il warning di deprecazione Node 20 nelle actions.
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Harden Git configuration before checkout
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --unset-all url.https://github.com/.insteadOf || true
          git config --global --unset-all url.git@github.com:.insteadOf || true
          git config --global --unset-all core.sshCommand || true
          git config --global --unset-all http.extraheader || true

      - name: Manual checkout without broken submodules
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/.git"
          git init "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"

          git config --local advice.detachedHead false
          git config --local --add safe.directory "$GITHUB_WORKSPACE"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            git fetch --no-tags --prune --progress origin \
              "+refs/pull/${{ github.event.pull_request.number }}/merge:refs/remotes/origin/pr-${{ github.event.pull_request.number }}-merge"
            git checkout --force "refs/remotes/origin/pr-${{ github.event.pull_request.number }}-merge"
          else
            git fetch --no-tags --prune --progress origin "+${GITHUB_REF}:${GITHUB_REF}"
            git checkout --force "$GITHUB_SHA"
          fi

          # Non eseguire `git submodule update`: utils/AROL_Library è un gitlink
          # senza URL in .gitmodules e causa exit code 128 sul runner.
          if command -v git-lfs >/dev/null 2>&1; then
            git lfs install --local
            git lfs pull || true
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies (obspy + pytest)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run pytest
        run: python -m pytest tests/ -v --tb=short
