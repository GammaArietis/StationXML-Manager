# Pytest su push verso main (obspy/ObsPy + resto da requirements.txt; pytest da requirements-dev.txt).
name: pytest

on:  
  push:    
    branches: [main]  
  pull_request:    
    branches: [main]

# Aggiungiamo esplicitamente i permessi di lettura per evitare l'errore Git 128 sul checkout
permissions:
  contents: read

jobs:  
  tests:    
    runs-on: ubuntu-latest    
    env:      
      # Evita richieste display se moduli Qt vengono caricati in headless CI      
      QT_QPA_PLATFORM: offscreen
      # Forza l'uso di Node.js 24 per silenziare il warning di deprecazione di Node 20
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      
    steps:      
      - name: Checkout        
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Spesso risolve errori 128 forzando il download completo della history

      - name: Set up Python        
        uses: actions/setup-python@v5        
        with:          
          python-version: "3.11"          
          cache: pip          
          cache-dependency-path: |            
            requirements.txt            
            requirements-dev.txt      
            
      - name: Install dependencies (obspy + pytest)        
        run: |          
          python -m pip install --upgrade pip          
          pip install -r requirements.txt -r requirements-dev.txt      
          
      - name: Run pytest        
        run: python -m pytest tests/ -v --tb=short
