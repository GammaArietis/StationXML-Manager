[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stationxml-manager"
version = "0.1.0"
description = "Desktop app for managing StationXML metadata"
requires-python = ">=3.10"
dependencies = [
  "PyQt6",
  "obspy",
  "requests",
  "numpy",
  "scipy",
  "matplotlib",
  "PyYAML",
  "jsonschema",
  "jsonref",
  "pydantic",
  "pydantic-settings",
  "fastapi",
  "uvicorn",
  "nicegui",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
